name: Emulator screenshots

# Boots a hardware-accelerated Android 14 emulator on GitHub's machines,
# installs the latest released Anita Shop (customer app) APK, walks the app
# by script (ci/walk.sh) and saves screenshots of every screen.
# Free: this repository is public, so Actions minutes are not billed.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to test (blank = latest release)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/emulator-screenshots.yml"
      - "ci/**"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the app (release APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            gh release download "${{ inputs.release_tag }}" --pattern "*.apk"
          else
            gh release download --pattern "*.apk"
          fi
          mv anita-shop-*.apk app.apk
          ls -la app.apk

      - name: Boot emulator and walk the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/walk.sh

      - name: Upload screenshots (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Publish screenshots to the emulator-screenshots branch
        if: always()
        run: |
          if [ -z "$(ls shots/*.png 2>/dev/null)" ]; then echo "no screenshots to publish"; exit 0; fi
          git config user.name "Anita Jewellery"
          git config user.email "anitajewellery@users.noreply.github.com"
          git fetch origin emulator-screenshots || true
          git switch -C emulator-screenshots origin/emulator-screenshots 2>/dev/null || git switch -c emulator-screenshots
          mkdir -p shots-latest
          rm -f shots-latest/*.png shots-latest/*.log shots-latest/*.xml
          cp shots/*.png shots-latest/ 2>/dev/null
          cp shots/*.log shots/*.xml shots-latest/ 2>/dev/null
          git add shots-latest
          git commit -m "Emulator screenshots (run ${{ github.run_number }})" || echo "nothing new to commit"
          git push origin emulator-screenshots
